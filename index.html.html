details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px}
summary{min-height:56px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none;gap:10px}

nav{position:fixed;left:0;right:0;bottom:0;background:#0a1b38;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}

nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

orks","m_stats":"My statistics","m_strat":"Strategies","m_admin":"Admin","sp":"Page opened in","s":"s","ver":"Bot version"},"uk":{"n1":"Статистика","n2":"Налаштування","n3":"Інструкція","n4":"Ще","ok":"справдилось","of":"із","w":"Справдилось","l":"Не справдилось","d24":"Усі сигнали бота за 24 години","wk":"За 7 днів","hc":"За впевненістю сигналу, 14 днів","he":"За терміном угоди, 14 днів","min":"хв","be":"Щоб бути в плюсі за виплати 85%, потрібно понад 54,1%.","nodata":"ще немає даних","sig":"Сигнали","on":"Увімкнені","off":"Вимкнені","hm":"Ринок","fx":"Форекс","otc":"OTC","both":"Обидва","ht":"Поріг впевненості","all":"Усі","hf":"Скільки сигналів","f1":"Тихо","f1s":"до 4 на годину","f2":"Активно","f2s":"до 10 на годину","f3":"Усі","f3s":"без ліміту","htf":"Таймфрейм","ha":"Активи","a1":"Усі пари","a2":"Основні","a3":"Свій список","a3n":"Свій список пар обирається в чаті.","a3b":"Обрати пари в чаті","hn":"Уночі","n_on":"Мовчу","n_off":"Надсилаю","htz":"Часовий пояс","auto":"Авто","hl":"Мова","save":"Зберегти","nochg":"Змін немає","th":"Під порогом — як справджувалися такі сигнали за 14 днів.","demo":"Це приклад: відкрийте сторінку з бота, щоб побачити свої цифри.","chat":"Ці розділи відкриються в чаті з ботом.","m_best":"Дай пару","m_modes":"Мої режими","m_watch":"Стеж за парою","m_sub":"Підписка","m_tech":"Як влаштований робот","m_stats":"Моя статистика","m_strat":"Стратегії","m_admin":"Адмін","sp":"Сторінка відкрилася за","s":"с","ver":"Версія бота"}},"G":{"ru":[["Добро пожаловать","Дорогой пользователь MY.SIGNALS! Спасибо, что вы с нами.\nЯ робот-аналитик: каждую минуту слежу за валютными парами и присылаю сигнал, когда вижу подходящий момент. В сигнале три вещи: пара, направление (вверх или вниз) и срок сделки.\nЯ не торгую за вас. У меня нет доступа к вашему счёту у брокера и к вашим деньгам, я не открываю сделки и не делаю ставок. Я только присылаю сигнал, а решение и сделка всегда ваши.\nМы независимы: MY.SIGNALS не принадлежит ни одному брокеру и не привязан ни к одной площадке."],["Два рынка: Форекс и OTC","Форекс — настоящий валютный рынок, работает с понедельника по пятницу. Курс один для всего мира, поэтому сигнал подходит к любому брокеру.\nOTC — пары с пометкой OTC. Их котировки рисует сам брокер, они работают и в выходные. У каждого брокера свой график OTC. Мои сигналы OTC рассчитаны по графикам Pocket Option и подходят только к ней.\nOTC анализировать труднее: движение задаёт брокер, а не рынок. Начните с Форекса. На OTC пользуйтесь кнопками «Проверь пару» и «Дай пару» и ставьте меньше обычного."],["Как войти в сделку","1. Пришёл сигнал. Откройте у брокера ту же пару. Если в сигнале написано OTC — выбирайте пару OTC.\n2. Поставьте тот же срок, что в сигнале.\n3. Откройте сделку во время, указанное в сигнале.\n4. Срок до 5 минут — входите в первые 30 секунд, иначе пропустите сигнал. Срок 15–30 минут — можно войти в течение 1–2 минут.\n5. Дождитесь конца срока и отметьте под сигналом «Выиграл» или «Проиграл». Я и сам проверю результат."],["Что значит процент уверенности","Процент в сигнале — моя оценка: как часто похожие сигналы сбывались раньше. 60% — это примерно 6 удачных сделок из 10. Ста процентов не бывает ни у кого.\nПорог выбирается в настройках. От 60% — сигналов меньше, стоит начать с него. От 55% — сигналов намного больше, это режим для опытных. «Все» — приходит всё, включая слабые сигналы с пометкой.\nКак на самом деле сбываются сигналы каждого порога, видно на вкладке «Статистика». Это мой собственный учёт, без приукрашивания."],["Какой срок выбрать","Сроки бывают от 1 до 30 минут. Чем короче срок, тем больше случайности и тем важнее войти вовремя.\nНа длинных сроках (15–30 минут) опоздание почти не меняет результат. На 1–2 минутах оно может решить всё.\nЕсли вы новичок, берите сигналы со сроком от 5 минут."],["Деньги: главное правило","Входите в сделку на 1–3% от депозита. При депозите 100 $ это 1–3 $. Тогда даже серия проигрышей не обнулит счёт.\nНе повышайте ставку после проигрыша, чтобы «отыграться».\nСмотрите на выплату у брокера. При выплате 85% нужно выигрывать больше 54 сделок из 100, чтобы быть в плюсе. При выплате 60% — уже больше 62.\nСигнал — подсказка, а не гарантия. Торгуйте только теми деньгами, которые можете позволить себе потерять."],["Площадки","Сигналы Форекс подходят к любой площадке, где есть сделки на срок по валютным парам: Pocket Option, IQ Option и другие. Сигналы OTC подходят только к Pocket Option.\nДоступность площадок зависит от вашей страны. До того как вносить деньги, проверьте на сайте брокера, работает ли он с ней.\nМы не рекомендуем конкретного брокера и не отвечаем за его работу."]],"ro":[["Bine ai venit","Dragă utilizator MY.SIGNALS! Îți mulțumim că ești cu noi.\nSunt un robot-analist: în fiecare minut urmăresc perechile valutare și îți trimit un semnal când văd un moment potrivit. Semnalul conține trei lucruri: perechea, direcția (sus sau jos) și durata tranzacției.\nNu tranzacționez în locul tău. Nu am acces la contul tău de la broker și nici la banii tăi, nu deschid tranzacții și nu pariez. Eu doar trimit semnalul, iar decizia și tranzacția sunt mereu ale tale.\nSuntem independenți: MY.SIGNALS nu aparține niciunui broker și nu este legat de nicio platformă."],["Două piețe: Forex și OTC","Forex — piața valutară reală, funcționează de luni până vineri. Cursul este același în toată lumea, așa că semnalul se potrivește la orice broker.\nOTC — perechile marcate OTC. Cotațiile lor sunt generate de broker și funcționează și în weekend. Fiecare broker are propriul grafic OTC. Semnalele mele OTC sunt calculate pe graficele Pocket Option și se potrivesc doar acolo.\nOTC se analizează mai greu: mișcarea o stabilește brokerul, nu piața. Începe cu Forex. Pe OTC folosește butoanele „Verifică perechea” și „Dă-mi o pereche” și mizează mai puțin decât de obicei."],["Cum intri în tranzacție","1. A venit semnalul. Deschide la broker aceeași pereche. Dacă în semnal scrie OTC, alege perechea OTC.\n2. Setează aceeași durată ca în semnal.\n3. Deschide tranzacția la ora indicată în semnal.\n4. Durată până la 5 minute — intră în primele 30 de secunde, altfel sari peste semnal. Durată de 15–30 de minute — poți intra în 1–2 minute.\n5. Așteaptă sfârșitul duratei și apasă sub semnal „Am câștigat” sau „Am pierdut”. Verific și eu rezultatul."],["Ce înseamnă procentul de încredere","Procentul din semnal este estimarea mea: cât de des s-au adeverit semnale asemănătoare în trecut. 60% înseamnă aproximativ 6 tranzacții reușite din 10. 100% nu există la nimeni.\nPragul se alege în setări. De la 60% — semnale mai puține, cu el merită să începi. De la 55% — semnale mult mai multe, este un mod pentru cei cu experiență. „Toate” — primești tot, inclusiv semnalele slabe, marcate ca atare.\nCum se adeveresc de fapt semnalele fiecărui prag se vede în fila „Statistică”. Este evidența mea proprie, fără înfrumusețări."],["Ce durată să alegi","Duratele sunt între 1 și 30 de minute. Cu cât durata este mai scurtă, cu atât mișcarea este mai întâmplătoare și cu atât contează mai mult să intri la timp.\nLa duratele lungi (15–30 de minute) o întârziere aproape nu schimbă rezultatul. La 1–2 minute poate decide totul.\nDacă ești la început, ia semnalele cu durata de la 5 minute în sus."],["Banii: regula principală","Intră în tranzacție cu 1–3% din sold. La un sold de 100 $ miza este 1–3 $. Astfel nici o serie de pierderi nu îți golește contul.\nNu mări miza după o pierdere ca să „recuperezi”.\nUită-te la plata brokerului. La o plată de 85% trebuie să câștigi peste 54 de tranzacții din 100 ca să fii pe plus. La o plată de 60% — deja peste 62.\nSemnalul este un indiciu, nu o garanție. Tranzacționează doar cu bani pe care îți permiți să-i pierzi."],["Platforme","Semnalele Forex se potrivesc la orice platformă cu tranzacții pe durată fixă pe perechi valutare: Pocket Option, IQ Option și altele. Semnalele OTC se potrivesc doar la Pocket Option.\nDisponibilitatea platformelor depinde de țara ta. Înainte să depui bani, verifică pe site-ul brokerului dacă lucrează cu ea.\nNu recomandăm un broker anume și nu răspundem pentru activitatea lui."]],"en":[["Welcome","Dear MY.SIGNALS user, thank you for being with us.\nI am an analyst robot: every minute I watch currency pairs and send you a signal when I see a suitable moment. A signal has three things: the pair, the direction (up or down) and the trade time.\nI do not trade for you. I have no access to your broker account or your money, I do not open trades and I do not place bets. I only send the signal; the decision and the trade are always yours.\nWe are independent: MY.SIGNALS does not belong to any broker and is not tied to any platform."],["Two markets: Forex and OTC","Forex is the real currency market, open Monday to Friday. The rate is the same worldwide, so a signal fits any broker.\nOTC means pairs marked OTC. Their quotes are generated by the broker and they also run on weekends. Every broker has its own OTC chart. My OTC signals are calculated on Pocket Option charts and fit only there.\nOTC is harder to analyse: the broker sets the movement, not the market. Start with Forex. On OTC use the “Check a pair” and “Give me a pair” buttons and stake less than usual."],["How to enter a trade","1. A signal arrived. Open the same pair at your broker. If the signal says OTC, choose the OTC pair.\n2. Set the same trade time as in the signal.\n3. Open the trade at the time shown in the signal.\n4. Up to 5 minutes: enter within the first 30 seconds, otherwise skip the signal. 15–30 minutes: you can enter within 1–2 minutes.\n5. Wait until the time is up and mark “Won” or “Lost” under the signal. I check the result myself too."],["What the confidence percent means","The percent in a signal is my estimate: how often similar signals came true before. 60% is roughly 6 winning trades out of 10. Nobody has 100%.\nYou choose the threshold in settings. From 60%: fewer signals, a good place to start. From 55%: many more signals, a mode for experienced users. “All”: everything arrives, including weak signals, which are marked.\nHow signals of each threshold actually come true is shown on the “Statistics” tab. It is my own record, with nothing dressed up."],["Which trade time to choose","Trade times run from 1 to 30 minutes. The shorter the time, the more random the move and the more it matters to enter on time.\nOn long times (15–30 minutes) a delay barely changes the result. On 1–2 minutes it can decide everything.\nIf you are a beginner, take signals with a time of 5 minutes or more."],["Money: the main rule","Enter a trade with 1–3% of your deposit. With a $100 deposit that is $1–3. Then even a losing streak will not empty your account.\nDo not raise the stake after a loss to “win it back”.\nLook at the broker's payout. At an 85% payout you need to win more than 54 trades out of 100 to be in profit. At a 60% payout, more than 62.\nA signal is a hint, not a guarantee. Trade only with money you can afford to lose."],["Platforms","Forex signals fit any platform that offers fixed-time trades on currency pairs: Pocket Option, IQ Option and others. OTC signals fit Pocket Option only.\nPlatform availability depends on your country. Before you deposit money, check on the broker's site whether it works with your country.\nWe do not recommend a particular broker and are not responsible for its service."]],"uk":[["Ласкаво просимо","Дорогий користувачу MY.SIGNALS! Дякуємо, що ви з нами.\nЯ робот-аналітик: щохвилини стежу за валютними парами й надсилаю сигнал, коли бачу слушний момент. У сигналі три речі: пара, напрямок (вгору або вниз) і термін угоди.\nЯ не торгую за вас. Я не маю доступу до вашого рахунку в брокера й до ваших грошей, не відкриваю угод і не роблю ставок. Я лише надсилаю сигнал, а рішення й угода завжди ваші.\nМи незалежні: MY.SIGNALS не належить жодному брокеру й не прив'язаний до жодного майданчика."],["Два ринки: Форекс і OTC","Форекс — справжній валютний ринок, працює з понеділка по п'ятницю. Курс один для всього світу, тому сигнал підходить до будь-якого брокера.\nOTC — пари з позначкою OTC. Їхні котирування малює сам брокер, вони працюють і у вихідні. У кожного брокера свій графік OTC. Мої сигнали OTC розраховані за графіками Pocket Option і підходять тільки до неї.\nOTC аналізувати важче: рух задає брокер, а не ринок. Почніть із Форексу. На OTC користуйтеся кнопками «Перевір пару» і «Дай пару» та ставте менше, ніж зазвичай."],["Як увійти в угоду","1. Надійшов сигнал. Відкрийте в брокера ту саму пару. Якщо в сигналі написано OTC — обирайте пару OTC.\n2. Поставте той самий термін, що в сигналі.\n3. Відкрийте угоду в час, зазначений у сигналі.\n4. Термін до 5 хвилин — входьте в перші 30 секунд, інакше пропустіть сигнал. Термін 15–30 хвилин — можна увійти протягом 1–2 хвилин.\n5. Дочекайтеся кінця терміну й позначте під сигналом «Виграв» або «Програв». Я й сам перевірю результат."],["Що означає відсоток впевненості","Відсоток у сигналі — моя оцінка: як часто схожі сигнали справджувалися раніше. 60% — це приблизно 6 вдалих угод із 10. Ста відсотків не буває ні в кого.\nПоріг обирається в налаштуваннях. Від 60% — сигналів менше, варто почати з нього. Від 55% — сигналів набагато більше, це режим для досвідчених. «Усі» — надходить усе, зокрема слабкі сигнали з позначкою.\nЯк насправді справджуються сигнали кожного порогу, видно на вкладці «Статистика». Це мій власний облік, без прикрашання."],["Який термін обрати","Терміни бувають від 1 до 30 хвилин. Що коротший термін, то більше випадковості й то важливіше увійти вчасно.\nНа довгих термінах (15–30 хвилин) запізнення майже не змінює результат. На 1–2 хвилинах воно може вирішити все.\nЯкщо ви новачок, беріть сигнали з терміном від 5 хвилин."],["Гроші: головне правило","Входьте в угоду на 1–3% від депозиту. За депозиту 100 $ це 1–3 $. Тоді навіть серія програшів не обнулить рахунок.\nНе підвищуйте ставку після програшу, щоб «відігратися».\nДивіться на виплату в брокера. За виплати 85% потрібно вигравати понад 54 угоди зі 100, щоб бути в плюсі. За виплати 60% — уже понад 62.\nСигнал — підказка, а не гарантія. Торгуйте лише тими грошима, які можете дозволити собі втратити."],["Майданчики","Сигнали Форекс підходять до будь-якого майданчика, де є угоди на термін за валютними парами: Pocket Option, IQ Option та інші. Сигнали OTC підходять тільки до Pocket Option.\nДоступність майданчиків залежить від вашої країни. Перш ніж вносити гроші, перевірте на сайті брокера, чи працює він із нею.\nМи не рекомендуємо конкретного брокера й не відповідаємо за його роботу."]]},"TZC":{"ru":{"-300":"Нью-Йорк, Торонто","-240":"Каракас, Сантьяго","-180":"Сан-Паулу, Буэнос-Айрес","0":"Лондон, Лиссабон, Аккра","60":"Берлин, Париж, Лагос","120":"Кишинёв, Киев, Бухарест, Каир","180":"Москва, Стамбул, Эр-Рияд","240":"Дубай, Баку","300":"Карачи, Ташкент","330":"Дели, Мумбаи","360":"Дакка, Алматы","420":"Джакарта, Бангкок","480":"Сингапур, Манила, Пекин","540":"Токио, Сеул"},"uk":{"-300":"Нью-Йорк, Торонто","-240":"Каракас, Сантьяго","-180":"Сан-Паулу, Буенос-Айрес","0":"Лондон, Лісабон, Аккра","60":"Берлін, Париж, Лагос","120":"Кишинів, Київ, Бухарест, Каїр","180":"Москва, Стамбул, Ер-Ріяд","240":"Дубай, Баку","300":"Карачі, Ташкент","330":"Делі, Мумбаї","360":"Дакка, Алмати","420":"Джакарта, Бангкок","480":"Сінгапур, Маніла, Пекін","540":"Токіо, Сеул"},"en":{"-300":"New York, Toronto","-240":"Caracas, Santiago","-180":"São Paulo, Buenos Aires","0":"London, Lisbon, Accra","60":"Berlin, Paris, Lagos","120":"Chisinau, Kyiv, Bucharest, Cairo","180":"Moscow, Istanbul, Riyadh","240":"Dubai, Baku","300":"Karachi, Tashkent","330":"Delhi, Mumbai","360":"Dhaka, Almaty","420":"Jakarta, Bangkok","480":"Singapore, Manila, Beijing","540":"Tokyo, Seoul"},"ro":{"-300":"New York, Toronto","-240":"Caracas, Santiago","-180":"São Paulo, Buenos Aires","0":"Londra, Lisabona, Accra","60":"Berlin, Paris, Lagos","120":"Chișinău, Kiev, București, Cairo","180":"Moscova, Istanbul, Riad","240":"Dubai, Baku","300":"Karachi, Tașkent","330":"Delhi, Mumbai","
