<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY.SIGNALS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#17212b;--card:#1f2c38;--chip:#22303d;--text:#fff;--hint:#a9b8c6;--good:#5fd38d;--bad:#f0a58c;--blue:#2b6cb0;--violet:#7a4fb5;--green:#1f7a4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
.pill{font-size:13px;color:var(--hint);padding:6px 12px;border-radius:999px;background:var(--chip)}
.tabs{display:flex;gap:8px;background:var(--chip);padding:4px;border-radius:14px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--hint);font:inherit;font-weight:600}
.tabs button[aria-selected=true]{background:var(--card);color:var(--text)}
.card{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--hint)}
.big{display:flex;align-items:baseline;gap:12px}
.big b{font-size:60px;line-height:1;font-weight:700}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--chip)}
.bar i{display:block}
.row{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.row .n{font-size:13px;color:var(--hint)}
.row .p{font-size:24px;font-weight:700}
.good{color:var(--good)}.bad{color:var(--bad)}
h2{margin:6px 0 0;font-size:14px;font-weight:500;color:var(--hint)}
.opts{display:flex;gap:8px}
.opts button{flex:1;min-height:56px;border:2px solid transparent;border-radius:14px;background:var(--chip);color:var(--text);font:inherit;font-weight:600;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opts button small{font-weight:400;font-size:12px;color:var(--hint)}
.opts.m button[aria-pressed=true]{background:var(--blue);border-color:#8fc1f5}
.opts.c button[aria-pressed=true]{background:var(--violet);border-color:#c9b0ef}
.opts.f button[aria-pressed=true]{background:var(--green);border-color:#8fe0b4}
.opts button[aria-pressed=true] small{color:#fff}
.save{min-height:56px;border:0;border-radius:14px;background:var(--good);color:#0e1621;font:inherit;font-size:17px;font-weight:700}
.demo{background:#4a3a12;color:#ffe2a1;border-radius:12px;padding:10px 12px;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>MY.SIGNALS</h1><span class="pill" id="mk"></span></header>
<div class="demo" id="demo" hidden></div>
<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true"></button>
<button role="tab" id="t2" aria-selected="false"></button>
</div>
<section id="p1">
<div style="display:flex;flex-direction:column;gap:14px">
<div class="card">
<div class="hint" id="dl"></div>
<div class="big"><b id="dp"></b><span id="dn"></span></div>
<div class="bar"><i id="bw" style="background:var(--good)"></i><i id="bl" style="background:#e0795a"></i></div>
<div class="hint" style="display:flex;justify-content:space-between"><span id="lw"></span><span id="ll"></span></div>
</div>
<h2 id="hc"></h2>
<div id="conf" style="display:flex;flex-direction:column;gap:10px"></div>
<div class="hint" id="be"></div>
</div>
</section>
<section id="p2" hidden>
<div style="display:flex;flex-direction:column;gap:10px">
<h2 id="hm"></h2><div class="opts m" id="om"></div>
<h2 id="ht"></h2><div class="opts c" id="oc"></div>
<h2 id="hf"></h2><div class="opts f" id="of"></div>
<div class="hint" id="th"></div>
<button class="save" id="save"></button>
</div>
</section>
</main>
<script>
var TX={
ru:{t1:"Статистика",t2:"Настройки",ok:"сбылось",of:"из",w:"Сбылось",l:"Не сбылось",hc:"По уверенности сигнала",be:"Чтобы быть в плюсе при выплате 85%, нужно больше 54,1%.",hm:"Рынок",ht:"Порог уверенности",hf:"Сколько сигналов",fx:"Форекс",otc:"OTC",both:"Оба",all:"Все",f1:"Тихо",f1s:"до 4 в час",f2:"Активно",f2s:"до 10 в час",f3:"Все",f3s:"без лимита",save:"Сохранить",demo:"Это пример: откройте страницу из бота, чтобы увидеть свои цифры.",th:"Под каждым порогом — как сбывались такие сигналы за последние недели.",nodata:"пока нет данных"},
ro:{t1:"Statistică",t2:"Setări",ok:"reușite",of:"din",w:"Reușite",l:"Nereușite",hc:"După încrederea semnalului",be:"Ca să fii pe plus la o plată de 85%, ai nevoie de peste 54,1%.",hm:"Piață",ht:"Prag de încredere",hf:"Câte semnale",fx:"Forex",otc:"OTC",both:"Ambele",all:"Toate",f1:"Liniștit",f1s:"până la 4 pe oră",f2:"Activ",f2s:"până la 10 pe oră",f3:"Toate",f3s:"fără limită",save:"Salvează",demo:"Acesta este un exemplu: deschide pagina din bot ca să vezi cifrele tale.",th:"Sub fiecare prag — cum s-au adeverit astfel de semnale în ultimele săptămâni.",nodata:"încă nu sunt date"},
en:{t1:"Statistics",t2:"Settings",ok:"came true",of:"of",w:"Came true",l:"Did not",hc:"By signal confidence",be:"To be in profit at an 85% payout you need more than 54.1%.",hm:"Market",ht:"Confidence threshold",hf:"How many signals",fx:"Forex",otc:"OTC",both:"Both",all:"All",f1:"Quiet",f1s:"up to 4 per hour",f2:"Active",f2s:"up to 10 per hour",f3:"All",f3s:"no limit",save:"Save",demo:"This is a sample: open the page from the bot to see your numbers.",th:"Under each threshold: how such signals came true over the last weeks.",nodata:"no data yet"},
uk:{t1:"Статистика",t2:"Налаштування",ok:"справдилось",of:"із",w:"Справдилось",l:"Не справдилось",hc:"За впевненістю сигналу",be:"Щоб бути в плюсі за виплати 85%, потрібно понад 54,1%.",hm:"Ринок",ht:"Поріг впевненості",hf:"Скільки сигналів",fx:"Форекс",otc:"OTC",both:"Обидва",all:"Усі",f1:"Тихо",f1s:"до 4 на годину",f2:"Активно",f2s:"до 10 на годину",f3:"Усі",f3s:"без ліміту",save:"Зберегти",demo:"Це приклад: відкрийте сторінку з бота, щоб побачити свої цифри.",th:"Під кожним порогом — як справджувалися такі сигнали за останні тижні.",nodata:"ще немає даних"}};
var tg=window.Telegram&&window.Telegram.WebApp;
function readData(){
  try{var m=location.hash.match(/d=([^&]+)/);if(!m)return null;
    var s=m[1].replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
    return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return null}
}
var D=readData(),demo=!D;
if(demo)D={lang:"ru",day:{label:"10.11",w:10,n:14},conf:[{r:"60–65%",w:179,n:314},{r:"65–70%",w:54,n:100},{r:"55–60%",w:323,n:653}],set:{market:"both",conf:"60",freq:"2"}};
var L=TX[D.lang]||TX.en,$=function(i){return document.getElementById(i)};
document.documentElement.lang=D.lang||"en";
function pct(w,n){return n?(100*w/n).toFixed(1).replace(".",D.lang==="en"?".":","):"—"}
function cls(w,n){return !n?"":(100*w/n>=54.1?"good":"bad")}
if(demo){$("demo").hidden=false;$("demo").textContent=L.demo}
$("t1").textContent=L.t1;$("t2").textContent=L.t2;
var S=Object.assign({market:"both",conf:"60",freq:"2"},D.set||{});
function mkName(){return S.market==="fx"?L.fx:S.market==="otc"?L.otc:L.fx+" + "+L.otc}
$("mk").textContent=mkName();
var d=D.day||{w:0,n:0,label:""};
$("dl").textContent=d.label||"";
$("dp").textContent=d.n?Math.round(100*d.w/d.n)+"%":"—";$("dp").className=cls(d.w,d.n);
$("dn").textContent=d.n?d.w+" "+L.of+" "+d.n+" "+L.ok:L.nodata;
$("bw").style.flex=d.w||0;$("bl").style.flex=(d.n-d.w)||0;
$("lw").textContent=L.w+" "+(d.w||0);$("ll").textContent=L.l+" "+((d.n-d.w)||0);
$("hc").textContent=L.hc;$("be").textContent=L.be;
(D.conf||[]).forEach(function(c){
  var r=document.createElement("div");r.className="row";
  var a=document.createElement("div"),b=document.createElement("div"),n=document.createElement("div"),p=document.createElement("div");
  b.textContent=c.r;b.style.fontWeight="600";n.className="n";n.textContent=c.w+" "+L.of+" "+c.n;a.appendChild(b);a.appendChild(n);
  p.className="p "+cls(c.w,c.n);p.textContent=pct(c.w,c.n)+"%";r.appendChild(a);r.appendChild(p);$("conf").appendChild(r);
});
$("hm").textContent=L.hm;$("ht").textContent=L.ht;$("hf").textContent=L.hf;$("th").textContent=L.th;$("save").textContent=L.save;
function confSub(v){var m={"55":"55–60%","60":"60–65%"}[v],c=(D.conf||[]).filter(function(x){return x.r===m})[0];return c&&c.n?pct(c.w,c.n)+"%":""}
function opts(id,key,list){
  list.forEach(function(o){
    var b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",String(S[key]===o[0]));
    b.appendChild(document.createTextNode(o[1]));
    if(o[2]){var s=document.createElement("small");s.textContent=o[2];b.appendChild(s)}
    b.onclick=function(){S[key]=o[0];[].forEach.call($(id).children,function(x){x.setAttribute("aria-pressed","false")});b.setAttribute("aria-pressed","true");$("mk").textContent=mkName();if(tg&&tg.HapticFeedback)tg.HapticFeedback.selectionChanged()};
    $(id).appendChild(b);
  });
}
opts("om","market",[["fx",L.fx],["otc",L.otc],["both",L.both]]);
opts("oc","conf",[["55","55%+",confSub("55")],["60","60%+",confSub("60")],["all",L.all]]);
opts("of","freq",[["1",L.f1,L.f1s],["2",L.f2,L.f2s],["3",L.f3,L.f3s]]);
function tab(n){$("p1").hidden=n!==1;$("p2").hidden=n!==2;$("t1").setAttribute("aria-selected",String(n===1));$("t2").setAttribute("aria-selected",String(n===2))}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
if(/tab=2/.test(location.hash))tab(2);
$("save").onclick=function(){
  var out=JSON.stringify({v:1,market:S.market,conf:S.conf,freq:S.freq});
  if(tg&&tg.sendData&&tg.initData!==undefined&&!demo){tg.sendData(out)}else{$("save").textContent="✓ "+L.save}
};
if(tg){try{tg.ready();tg.expand();
  var p=tg.themeParams||{},r=document.documentElement.style;
  if(tg.colorScheme==="light"){r.setProperty("--bg",p.secondary_bg_color||"#eff1f4");r.setProperty("--card",p.bg_color||"#fff");r.setProperty("--chip","#dfe5ec");r.setProperty("--text",p.text_color||"#111");r.setProperty("--hint","#56616d");r.setProperty("--good","#177a45");r.setProperty("--bad","#a8452c")}
}catch(e){}}
</script>
</body>
</html>
